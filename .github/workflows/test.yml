# Runs the full test suite.  Every push, on two compilers, plus an address/UB
# sanitizer pass that catches what assertions cannot.
name: test

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: test-${{ github.ref }}
  cancel-in-progress: true

env:
  CCACHE_DIR: ${{ github.workspace }}/.ccache

jobs:
  suite:
    name: tests (${{ matrix.cc }})
    runs-on: ubuntu-24.04
    strategy:
      fail-fast: false
      matrix:
        cc: [gcc-14, clang-18]
    steps:
      - uses: actions/checkout@v4

      - name: Install dependencies
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y --no-install-recommends ${{ matrix.cc }} ccache

      - name: Restore ccache
        uses: actions/cache@v4
        with:
          path: ${{ env.CCACHE_DIR }}
          key: ccache-test-${{ matrix.cc }}-${{ hashFiles('src/**', 'tests/**', 'Makefile') }}
          restore-keys: ccache-test-${{ matrix.cc }}-

      - name: Build and run
        run: |
          mkdir -p "$CCACHE_DIR"
          ./scripts/test.sh -v -j"$(nproc)"
          ccache --show-stats

      - name: Re-run verbosely for the log
        if: failure()
        run: ./tests/rvm_tests -v || true

  sanitizers:
    name: asan + ubsan
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4

      - name: Install dependencies
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y --no-install-recommends clang-18 ccache

      - name: Restore ccache
        uses: actions/cache@v4
        with:
          path: ${{ env.CCACHE_DIR }}
          key: ccache-san-${{ hashFiles('src/**', 'tests/**', 'Makefile') }}
          restore-keys: ccache-san-

      - name: Run the suite under ASan and UBSan
        run: |
          mkdir -p "$CCACHE_DIR"
          export ASAN_OPTIONS=detect_leaks=1:abort_on_error=0
          export UBSAN_OPTIONS=print_stacktrace=1:halt_on_error=1
          make CC=clang-18 -j"$(nproc)" MODE=sanity test TEST_ARGS=-v

  coverage:
    name: coverage
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4

      - name: Install dependencies
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y --no-install-recommends gcc-14 lcov

      - name: Coverage build and run
        run: ./scripts/test.sh --coverage -j"$(nproc)"

      - name: Summary
        run: |
          lcov --capture --directory build --output-file coverage.info \
               --rc lcov_branch_coverage=1 --quiet || true
          lcov --remove coverage.info '/usr/*' --output-file coverage.info --quiet || true
          lcov --summary coverage.info || true
          {
            echo '### Coverage'
            echo '```'
            lcov --summary coverage.info 2>&1 || true
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Upload coverage.info
        uses: actions/upload-artifact@v4
        with:
          name: coverage-info
          path: coverage.info
          if-no-files-found: warn
