name: kernel

on:
  workflow_dispatch:
    inputs:
      tag:
        description: 'Release tag'
        required: true
  push:
    tags:
      - "v*"

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4

      - name: install tools
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y --no-install-recommends \
            gcc-riscv64-linux-gnu bc bison flex libssl-dev \
            libncurses-dev device-tree-compiler wget

      - name: download kernel source
        run: |
          wget -q http://deb.debian.org/debian/pool/main/l/linux/linux-source-6.12_6.12.107-1_all.deb
          dpkg-deb -x linux-source-*.deb srcdir/
          find srcdir -name 'linux-source-*.tar.*' -ls
          cd srcdir/usr/src
          tar -xf linux-source-6.12.tar.xz
          mv linux-source-6.12 linux
          ls -la linux/ | head

      - name: download debian config
        run: |
          wget -q http://deb.debian.org/debian/pool/main/l/linux/linux-image-6.12.107+deb13-riscv64_6.12.107-1_riscv64.deb
          dpkg-deb -x linux-image-*.deb kdir/
          cp kdir/boot/config-6.12.107+deb13-riscv64 srcdir/usr/src/linux/.config

      - name: enable virtio built-in
        working-directory: srcdir/usr/src/linux
        run: |
          scripts/config --enable CONFIG_VIRTIO_BLK
          scripts/config --enable CONFIG_VIRTIO_MMIO
          scripts/config --enable CONFIG_VIRTIO_PCI
          scripts/config --enable CONFIG_VIRTIO_NET
          scripts/config --enable CONFIG_BLK_DEV_INITRD
          scripts/config --enable CONFIG_CRYPTO_MANAGER_DISABLE_TESTS
          scripts/config --enable CONFIG_EXT4_FS
          scripts/config --enable CONFIG_DEVTMPFS
          scripts/config --enable CONFIG_DEVTMPFS_MOUNT

      - name: build
        working-directory: srcdir/usr/src/linux
        run: |
          make ARCH=riscv CROSS_COMPILE=riscv64-linux-gnu- olddefconfig
          make ARCH=riscv CROSS_COMPILE=riscv64-linux-gnu- -j$(nproc) Image

      - name: collect
        run: |
          mkdir -p out
          cp srcdir/usr/src/linux/arch/riscv/boot/Image out/Image
          cp srcdir/usr/src/linux/System.map out/System.map 2>/dev/null || true
          ls -la out/

      # The initramfs belongs next to the kernel: without it there is no /init
      # to hand the guest over to the disk, and a phone is left in a shell with
      # no apt and no network.  Same script the repo tells you to run.
      - name: build the initramfs
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y --no-install-recommends binutils xz-utils
          bash tools/mkinitrd.sh --out out/initrd.img
          ls -la out/

      - uses: actions/upload-artifact@v4
        with:
          name: kernel-riscv64
          path: out/
          retention-days: 30

      - name: publish to release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ github.event.inputs.tag || github.ref_name }}
          files: |
            out/Image
            out/initrd.img
          fail_on_unmatched_files: false
