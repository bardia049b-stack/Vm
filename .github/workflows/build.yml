# Builds ./rvm on Linux and macOS and uploads it as an artefact.
#
# ccache is keyed on the compiler, the flags and the source hash, so a warm
# run relinks instead of recompiling.  The build uses -Werror: a new warning
# fails CI rather than accumulating silently.
name: build

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: build-${{ github.ref }}
  cancel-in-progress: true

env:
  CCACHE_DIR: ${{ github.workspace }}/.ccache

jobs:
  linux:
    name: linux (gcc ${{ matrix.cc }})
    runs-on: ubuntu-24.04
    strategy:
      fail-fast: false
      matrix:
        cc: [gcc-13, gcc-14, clang-18]
    steps:
      - uses: actions/checkout@v4

      - name: Install the compiler
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y --no-install-recommends ${{ matrix.cc }} ccache device-tree-compiler

      - name: Restore ccache
        uses: actions/cache@v4
        with:
          path: ${{ env.CCACHE_DIR }}
          key: ccache-linux-${{ matrix.cc }}-${{ hashFiles('src/**', 'tests/**', 'Makefile') }}
          restore-keys: ccache-linux-${{ matrix.cc }}-

      - name: The workflow files parse
        run: |
          set -e
          # Nothing else in the gate reads .github/workflows.  A block scalar whose
          # continuation lines slipped to column 0 made release.yml unloadable, and
          # the only sign was a red run named after the file path with no jobs and
          # no log at all -- which is a terrible way to find out on a tag push.
          python3 -c "import yaml" 2>/dev/null || python3 -m pip install --quiet pyyaml
          python3 - <<'PY'
          import glob, sys, yaml
          files = sorted(glob.glob(".github/workflows/*.yml"))
          bad = 0
          for f in files:
              try:
                  doc = yaml.safe_load(open(f))
                  assert doc.get("jobs"), "no jobs"
              except Exception as e:
                  bad += 1
                  print("::error file=%s::%s" % (f, str(e).replace("\n", " ")))
          print("workflows parse: %d files, %d broken" % (len(files), bad))
          sys.exit(1 if bad else 0)
          PY

      - name: Build
        run: |
          mkdir -p "$CCACHE_DIR"
          make CC=${{ matrix.cc }} -j"$(nproc)" WERROR=1 rvm
          ccache --show-stats

      # PLAN makes "the desktop binary is under 300 KB" a rule, not a wish, so
      # it is asserted here.  It was silently over for a long time.
      - name: Check the size budget
        run: |
          SIZE=$(stat -c %s rvm)
          echo "rvm is $SIZE bytes ($(( SIZE / 1024 )) KiB)"
          if [ "$SIZE" -gt $(( 300 * 1024 )) ]; then
            echo "::error::rvm is $SIZE bytes, over the 300 KiB budget in PLAN"
            exit 1
          fi

      - name: Compile the device tree
        run: make dtb && ls -l dtb/rvm.dtb

      - name: Smoke-test the binary
        run: |
          ./rvm --version
          ./rvm --help | head -5
          ./rvm --dump-dtb /tmp/rvm.dtb
          test -s /tmp/rvm.dtb

      - name: Upload rvm
        if: matrix.cc == 'gcc-14'
        uses: actions/upload-artifact@v4
        with:
          name: rvm-linux-amd64
          path: rvm
          if-no-files-found: error

      - name: Upload the compiled device tree
        if: matrix.cc == 'gcc-14'
        uses: actions/upload-artifact@v4
        with:
          name: rvm-dtb
          path: dtb/rvm.dtb
          if-no-files-found: error

  macos:
    name: macos (apple clang)
    runs-on: macos-14
    steps:
      - uses: actions/checkout@v4

      - name: Install ccache
        run: brew install ccache

      - name: Restore ccache
        uses: actions/cache@v4
        with:
          path: ${{ env.CCACHE_DIR }}
          key: ccache-macos-${{ hashFiles('src/**', 'tests/**', 'Makefile') }}
          restore-keys: ccache-macos-

      - name: Build
        run: |
          mkdir -p "$CCACHE_DIR"
          make -j"$(sysctl -n hw.ncpu)" WERROR=1 rvm
          ccache --show-stats

      - name: Smoke-test the binary
        run: ./rvm --version && ./rvm --dump-dtb /tmp/rvm.dtb && test -s /tmp/rvm.dtb

      - name: Upload rvm
        uses: actions/upload-artifact@v4
        with:
          name: rvm-macos-arm64
          path: rvm
          if-no-files-found: error
