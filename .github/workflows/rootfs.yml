name: rootfs

on:
  workflow_dispatch:
    inputs:
      tag:
        description: 'Release tag'
        required: true
  push:
    tags:
      - "v*"

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4

      - name: install debootstrap
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y --no-install-recommends \
            debootstrap qemu-user-static e2fsprogs

      - name: build rootfs
        run: |
          set -e
          sudo mkdir -p /srv/rootfs
          sudo debootstrap --arch=riscv64 --foreign --variant=minbase \
            trixie /srv/rootfs http://deb.debian.org/debian
          sudo cp /usr/bin/qemu-riscv64-static /srv/rootfs/usr/bin/
          sudo chroot /srv/rootfs /usr/bin/qemu-riscv64-static \
            /bin/sh /debootstrap/debootstrap --second-stage

      - name: configure init + getty + login
        run: |
          set -e
          sudo cp /etc/resolv.conf /srv/rootfs/etc/resolv.conf
          sudo chroot /srv/rootfs /usr/bin/qemu-riscv64-static /bin/bash -c "
            apt-get update
            apt-get install -y --no-install-recommends \
              sysvinit-core ifupdown isc-dhcp-client iproute2 iputils-ping curl wget ca-certificates
            echo 'root:root' | chpasswd
            echo 'T0:23:respawn:/sbin/getty -L ttyS0 115200 vt100' >> /etc/inittab
            echo 'rvm' > /etc/hostname
            echo '/dev/vda / ext4 defaults 0 1' > /etc/fstab
            echo 'proc /proc proc defaults 0 0' >> /etc/fstab
            echo 'sysfs /sys sysfs defaults 0 0' >> /etc/fstab
          "

      # The emulator's userspace NAT answers ARP, DHCP and DNS for
      # 10.0.2.15/24 with the gateway on 10.0.2.2 and the resolver on
      # 10.0.2.3 (see src/devices/net_user.c).  None of that reaches the guest
      # unless something inside it asks for a lease, so the image has to bring
      # eth0 up with ifupdown.  A minbase rootfs has no network config at all,
      # which is why apt and ping had no route on a phone.
      - name: configure eth0 through the built-in NAT
        run: |
          set -e
          sudo tee /srv/rootfs/etc/network/interfaces > /dev/null <<'IFACES'
          auto lo
          iface lo inet loopback

          auto eth0
          iface eth0 inet dhcp
          IFACES
          sudo mkdir -p /srv/rootfs/etc/resolvconf/update-libc.d
          sudo tee /srv/rootfs/etc/resolv.conf > /dev/null <<'RESOLV'
          nameserver 10.0.2.3
          options timeout:1 attempts:2
          RESOLV
          # The acceptance test for PLAN step 9, run here so a green build means
          # the image really carries the pieces the guest boots with, and not
          # just that an ext4 file packed.  ifupdown's SysV link is what brings
          # eth0 up during boot.
          sudo chroot /srv/rootfs /usr/bin/qemu-riscv64-static /bin/bash -ec '
            test -x /etc/init.d/networking
            ls /etc/rcS.d/S*networking /etc/rc2.d/S*networking > /dev/null
            command -v dhclient ip apt >/dev/null
            grep -q "^auto eth0" /etc/network/interfaces
          '

      - name: build disk.img
        run: |
          set -e
          sudo dd if=/dev/zero of=/srv/disk.img bs=1M count=2048
          sudo mkfs.ext4 -F -L rootfs /srv/disk.img
          sudo mkdir -p /mnt/rootfs
          sudo mount -o loop /srv/disk.img /mnt/rootfs
          sudo cp -a /srv/rootfs/* /mnt/rootfs/
          sudo umount /mnt/rootfs
          sudo gzip -k /srv/disk.img
          ls -la /srv/disk.img.gz

      - uses: actions/upload-artifact@v4
        with:
          name: disk-img
          path: /srv/disk.img.gz
          retention-days: 30

      - name: publish to release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ github.event.inputs.tag || github.ref_name }}
          files: /srv/disk.img.gz
          fail_on_unmatched_files: false
