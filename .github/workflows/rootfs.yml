name: rootfs

on:
  workflow_dispatch:
    inputs:
      tag:
        description: 'Release tag'
        required: true
  push:
    tags:
      - "v*"

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4

      - name: install debootstrap
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y --no-install-recommends \
            debootstrap qemu-user-static e2fsprogs

      - name: build rootfs
        run: |
          set -e
          sudo mkdir -p /srv/rootfs
          sudo debootstrap --arch=riscv64 --foreign --variant=minbase \
            trixie /srv/rootfs http://deb.debian.org/debian
          sudo cp /usr/bin/qemu-riscv64-static /srv/rootfs/usr/bin/
          sudo chroot /srv/rootfs /usr/bin/qemu-riscv64-static \
            /bin/sh /debootstrap/debootstrap --second-stage

      - name: configure init + getty + login
        run: |
          set -e
          sudo cp /etc/resolv.conf /srv/rootfs/etc/resolv.conf
          # Everything here is one double-quoted argument to bash inside the
          # chroot, so no quote of any kind may appear in it -- a stray one
          # closes the string early and the remaining lines silently stop being
          # part of the command.  -ec for the same reason: without it a failed
          # apt install leaves the step green, which is how this image shipped
          # without ifupdown once.
          # e2fsprogs: minbase has no fsck.ext4, so a filesystem that asks to be
          # checked drops the console into maintenance mode with no tool to fix it.
          sudo chroot /srv/rootfs /usr/bin/qemu-riscv64-static /bin/bash -ec "
            apt-get update
            apt-get install -y --no-install-recommends sysvinit-core ifupdown isc-dhcp-client iproute2 iputils-ping curl wget ca-certificates e2fsprogs
            echo 'root:root' | chpasswd
            echo 'T0:23:respawn:/sbin/getty -L ttyS0 115200 vt100' >> /etc/inittab
            echo 'rvm' > /etc/hostname
            echo '/dev/vda / ext4 defaults,nofail 0 0' > /etc/fstab
            echo 'proc /proc proc defaults 0 0' >> /etc/fstab
            echo 'sysfs /sys sysfs defaults 0 0' >> /etc/fstab
          "

      # The emulator's userspace NAT answers ARP, DHCP and DNS for
      # 10.0.2.15/24 with the gateway on 10.0.2.2 and the resolver on
      # 10.0.2.3 (see src/devices/net_user.c).  None of that reaches the guest
      # unless something inside it asks for a lease, so the image has to bring
      # eth0 up with ifupdown.  A minbase rootfs has no network config at all,
      # which is why apt and ping had no route on a phone.
      - name: configure eth0 through the built-in NAT
        run: |
          set -e
          # eth0 is manual on purpose.  The initramfs already negotiated the
          # lease with rvm's own userspace NAT and leaves the address, the route
          # and the resolver on the way into this rootfs, so all ifupdown has to
          # do is keep the interface UP.  Asking it to run a DHCP client during
          # boot instead put the console at the mercy of that client: udhcpc
          # worked, ISC dhclient printed a banner and then blocked before it even
          # bound a socket, and either way a phone sat at
          # "Configuring network interfaces" instead of showing a login prompt.
          # `dhclient eth0` still works by hand, bounded by the config below.
          sudo tee /srv/rootfs/etc/network/interfaces > /dev/null <<'IFACES'
          auto lo
          iface lo inet loopback

          auto eth0
          iface eth0 inet manual
          IFACES
          # A static resolv.conf, written here rather than left to the runner.
          # The guest resolver is 10.0.2.3, the userspace NAT inside rvm.
          sudo rm -f /srv/rootfs/etc/resolv.conf
          sudo tee /srv/rootfs/etc/resolv.conf > /dev/null <<'RESOLV'
          nameserver 10.0.2.3
          options timeout:1 attempts:2
          RESOLV
          # The acceptance test for PLAN step 9, run here so a green build means
          # the image really carries the pieces the guest boots with, and not
          # just that an ext4 file packed.  The rcS.d link is the one worth
          # asserting: the first image with ifupdown installed failed here over a
          # package list that had silently not been installed at all.
          sudo chroot /srv/rootfs /usr/bin/qemu-riscv64-static /bin/bash -ec '
            test -x /etc/init.d/networking
            ls /etc/rcS.d/S*networking > /dev/null
            command -v dhclient ip apt resize2fs > /dev/null
            grep -q "^auto eth0" /etc/network/interfaces
            grep -q "^iface eth0 inet manual" /etc/network/interfaces
            test -f /etc/resolv.conf
            grep -q 10.0.2.3 /etc/resolv.conf
          '

      - name: keep a manual dhclient short
        run: |
          set -e
          # Not for boot -- eth0 is manual now, see above -- but a user who runs
          # `dhclient eth0` by hand should not inherit ISC's five-minute retry
          # schedule either, and ISC logs to syslog rather than the console, so
          # that wait is invisible from the serial line.
          sudo tee /srv/rootfs/etc/dhcp/dhclient.conf > /dev/null <<'DHCPC'
          timeout 15;
          retry 5;
          reboot 3;
          backoff-cutoff 2;
          initial-interval 2;
          request subnet-mask, routers, domain-name-servers, host-name;
          DHCPC
          # Checked against dhclient's own parser rather than a grep: the first
          # version of this file used dhcpd statements (timeout bootp, select
          # retry-times), dhclient complained about them on the console and then
          # carried on with its five-minute default, which is worse than not
          # shipping the file at all.
          sudo chroot /srv/rootfs /usr/bin/qemu-riscv64-static /bin/bash -ec '
            grep -q "^timeout 15;" /etc/dhcp/dhclient.conf
            out=$(dhclient -t 1 -cf /etc/dhcp/dhclient.conf 2>&1 || true)
            case "$out" in
              *semicolon*|*Expecting*|*syntax*|*unexpected*) echo "dhclient.conf: $out"; exit 1 ;;
            esac
          '

      - name: enable networking at boot
        run: |
          set -e
          # Insurance, not a fix.  ifupdown's own postinst normally creates the
          # rcS.d link -- the assertion in the step above is what proves it -- but
          # every enable is skipped while /usr/sbin/policy-rc.d sits in the target,
          # and a minbase chroot is where that file tends to survive.  -f so that
          # re-running this over an existing link is not an error.
          sudo rm -f /srv/rootfs/usr/sbin/policy-rc.d
          sudo chroot /srv/rootfs /usr/bin/qemu-riscv64-static /bin/sh -c \
            'update-rc.d -f networking start 20 S . stop 20 0 1 6 .'
          sudo ls /srv/rootfs/etc/rcS.d | grep networking

      - name: build disk.img
        run: |
          set -e
          sudo dd if=/dev/zero of=/srv/disk.img bs=1M count=2048
          sudo mkfs.ext4 -F -L rootfs /srv/disk.img
          sudo mkdir -p /mnt/rootfs
          sudo mount -o loop /srv/disk.img /mnt/rootfs
          sudo cp -a /srv/rootfs/* /mnt/rootfs/
          sudo umount /mnt/rootfs
          sudo gzip -k /srv/disk.img
          ls -la /srv/disk.img.gz

      - uses: actions/upload-artifact@v4
        with:
          name: disk-img
          path: /srv/disk.img.gz
          retention-days: 30

      - name: publish to release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ github.event.inputs.tag || github.ref_name }}
          files: /srv/disk.img.gz
          fail_on_unmatched_files: false
